apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: ${APPNAME}
  name: ${APPNAME}
  namespace: ${NAMESPACE}
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: ${APPNAME}
  serviceName: ""
  template:
    metadata:
      labels:
        app: ${APPNAME}
    spec:
      hostname: ${APPNAME}-pod
      # pvc-rhino-shared (CephFS, ReadWriteMany) works on any node. Its attachment on puma is stuck
      # being deleted, so keep off puma until that is fixed; then this block can go.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - puma
      securityContext:
        runAsNonRoot: true
        runAsUser: 2828
        seccompProfile:
          type: RuntimeDefault
      containers:
        - command:
            - sleep
            - infinity
          envFrom:
            - configMapRef:
                name: proxy-config
          image: ${REMOTE_REGISTRY}/${APPNAME}:${APPVERSION}
          imagePullPolicy: Always
          name: ${APPNAME}
          resources:
            # No GPU: the app runs without the AI worker (SIMPLE_ANNOTATOR_AI=0).
            limits:
              memory: 8Gi
            requests:
              cpu: "1"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            # Only this one folder of the shared rhino volume: code, database and backups.
            - mountPath: /data/rhino/${APPNAME}
              name: rhino-volume-shared
              subPath: ${APPNAME}
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      preemptionPolicy: PreemptLowerPriority
      priority: 0
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 10
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: rhino-volume-shared
          persistentVolumeClaim:
            claimName: pvc-rhino-shared
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
