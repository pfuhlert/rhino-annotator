apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: ${APPNAME}
  name: ${APPNAME}
  namespace: ${NAMESPACE}
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: ${APPNAME}
  serviceName: ""
  template:
    metadata:
      labels:
        app: ${APPNAME}
    spec:
      hostname: ${APPNAME}-pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 2828
        runAsGroup: 1735
        seccompProfile:
          type: RuntimeDefault
      containers:
        - command:
            - sleep
            - infinity
          envFrom:
            - configMapRef:
                name: proxy-config
          image: ${REMOTE_REGISTRY}/${APPNAME}:${APPVERSION}
          imagePullPolicy: Always
          name: ${APPNAME}
          resources:
            # One GPU slice for the AI worker (SAM / μSAM), like the other pods in rhino.
            limits:
              memory: 32Gi
              nvidia.com/mig-1g.35gb: "1"
            requests:
              cpu: "8"
              memory: 32Gi
              nvidia.com/mig-1g.35gb: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            # Only this one folder of the shared rhino volume: code, database and backups.
            - mountPath: /data/rhino/${APPNAME}
              name: rhino-volume-shared
              subPath: ${APPNAME}
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      preemptionPolicy: PreemptLowerPriority
      priority: 0
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 10
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: rhino-volume-shared
          persistentVolumeClaim:
            claimName: pvc-rhino-shared
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
