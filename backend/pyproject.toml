[project]
name = "rhino-annotator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "pillow>=11",
    "python-dotenv>=1.2.3",
    "shapely>=2.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
ai = [
    "segment-anything==1.0",
    "torch>=2.6,<3",
    "torchvision>=0.21",
    "xxhash>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhino_annotator"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
